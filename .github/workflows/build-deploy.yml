name: build-deploy

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write   # 최초 1회 암호화된 서명 키를 저장소에 커밋하기 위해

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false # 배포가 진행 중이면 끝까지 돌리고 다음 것은 대기 (함수 배포 결과를 놓치지 않게)

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5

      - name: 필수 시크릿 확인
        run: |
          missing=0
          for v in KEYSTORE_PASSPHRASE; do
            if [ -z "${!v}" ]; then echo "::error::GitHub Secret $v 가 없어. README의 시크릿 등록 단계를 확인해줘."; missing=1; fi
          done
          [ ${#KEYSTORE_PASSPHRASE} -ge 16 ] || { echo "::error::KEYSTORE_PASSPHRASE는 16자 이상이어야 해 (공개 저장소라 약하면 위험)."; missing=1; }
          exit $missing

      - name: Firebase 설정 파일 생성
        run: |
          # Firebase 웹/Android 키는 공개 값이라 config/firebase_public.json 에 커밋해서 쓴다 (복붙 오류 방지)
          cp config/firebase_public.json firebase_config.json
          jq -e . firebase_config.json > /dev/null

      - name: Firebase 키 검증 (구글 서버에 실제로 유효한지 확인)
        run: |
          bad=0
          for name in WEB_API_KEY ANDROID_API_KEY; do
            key=$(jq -r ".$name" firebase_config.json)
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://identitytoolkit.googleapis.com/v1/projects?key=$key")
            echo "$name: ${key:0:8}...${key: -4} (길이 ${#key}) -> HTTP $code"
            if [ "$code" != 200 ]; then echo "::error::$name 이 Google에서 거절됨 (HTTP $code). config/firebase_public.json 값을 확인해줘."; bad=1; fi
          done
          exit $bad

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # 서명 키: 저장소에는 비밀번호로 암호화된 파일만 둔다.
      # 처음엔 새로 만들어 커밋하고, 이후에는 복호화해서 재사용 (APK를 덮어씌워 업데이트하려면 키가 항상 같아야 함)
      - name: 서명 키 준비
        run: |
          set -e
          cd android
          if [ -f ourday.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ourday.jks.enc -out app/ourday.jks -pass env:KEYSTORE_PASSPHRASE
          else
            keytool -genkeypair -v -keystore app/ourday.jks -alias ourday -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$KEYSTORE_PASSPHRASE" -keypass "$KEYSTORE_PASSPHRASE" -dname "CN=OurDay"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in app/ourday.jks -out ourday.jks.enc -pass env:KEYSTORE_PASSPHRASE
            cd ..
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/ourday.jks.enc
            git commit -m "chore: 암호화된 안드로이드 서명 키 추가"
            git push origin HEAD:"${GITHUB_REF_NAME}"
            cd android
          fi
          cat > key.properties <<KP
          storePassword=$KEYSTORE_PASSPHRASE
          keyPassword=$KEYSTORE_PASSPHRASE
          keyAlias=ourday
          storeFile=ourday.jks
          KP
          sed -i 's/^ *//' key.properties
          {
            echo "### 안드로이드 서명 지문 (Firebase 콘솔 > 내 앱 > SHA 인증서 지문에 등록)"
            keytool -list -v -keystore app/ourday.jks -alias ourday -storepass "$KEYSTORE_PASSPHRASE" | grep -E "SHA1|SHA256"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: APK 빌드
        run: flutter build apk --release --dart-define-from-file=firebase_config.json --dart-define=APP_VERSION=${GITHUB_SHA::7}

      - name: 웹 빌드
        run: flutter build web --release --dart-define-from-file=firebase_config.json --dart-define=APP_VERSION=${GITHUB_SHA::7}

      - uses: actions/upload-artifact@v5
        with:
          name: ourday-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # 출발 시간 알림의 길찾기 키 (선택). 없으면 직선거리로 어림잡아 알린다.
      - name: 서버 함수 환경 설정
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          if [ -n "$KAKAO_REST_KEY" ]; then
            printf 'KAKAO_REST_KEY=%s\n' "$KAKAO_REST_KEY" > functions/.env
            echo "길찾기 키를 서버 함수에 넣었어."
          else
            echo "::notice::KAKAO_REST_KEY 시크릿이 없어서 출발 시간 알림은 직선거리 어림값으로 계산해."
          fi

      - name: 서버 함수 설치와 테스트
        run: |
          npm ci --prefix functions
          npm test --prefix functions

      - name: Firebase 배포 (호스팅 + 보안 규칙)
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          project=$(jq -r .PROJECT_ID firebase_config.json)
          npx -y firebase-tools@latest deploy --only hosting,firestore --project "$project" --non-interactive

      # 서버 함수는 따로 배포한다: 권한/API 문제로 실패해도 웹 배포는 유지되게 하고, 로그로 원인을 확인한다.
      - name: Firebase 서버 함수 배포
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        continue-on-error: true
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          project=$(jq -r .PROJECT_ID firebase_config.json)
          npx -y firebase-tools@latest deploy --only functions --project "$project" --non-interactive --force

      # 호출형 함수는 앱이 보낸 로그인 토큰을 함수 안에서 검사한다(req.auth). Cloud Run 앞단 호출 권한이
      # 비어 있으면 앱 요청이 401 UNAUTHENTICATED 로 막히므로, 호출형 함수만 모두에게 열어둔다.
      - name: 호출형 함수 호출 권한 열기 (Cloud Run invoker)
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        continue-on-error: true
        run: |
          project=$(jq -r .PROJECT_ID firebase_config.json)
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          for fn in nudge notifyComplete notifyShared syncSubscription removeSubscription searchPlaces removeMember allowMember; do
            svc=$(echo "$fn" | tr 'A-Z' 'a-z')
            echo "== $fn ($svc) =="
            gcloud run services add-iam-policy-binding "$svc" --region=asia-northeast3 --project="$project" \
              --member=allUsers --role=roles/run.invoker --quiet --format='value(etag)' || echo "::warning::$fn 호출 권한 설정 실패"
          done

      - name: 배포 건너뜀 안내
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT == '' }}
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT 시크릿이 없어서 웹/보안 규칙 배포는 건너뛰었어."
