name: polestar-auto-off apk

on:
  push:
    paths:
      - "polestar-auto-off/**"
      - ".github/workflows/polestar-auto-off.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: gradle -p polestar-auto-off assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: polestar-auto-off-debug-apk
          path: polestar-auto-off/app/build/outputs/apk/debug/app-debug.apk
