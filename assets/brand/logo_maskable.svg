<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7B267"/><stop offset="1" stop-color="#D9702A"/>
    </linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3C4"/><stop offset="1" stop-color="#FFD0A0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7A3A0A" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/><g transform="translate(61.4 61.4) scale(.76)">
  <!-- calendar card -->
  <g filter="url(#sh)">
    <rect x="92" y="118" width="328" height="318" rx="48" fill="#FFFFFF"/>
  </g>
  <path d="M92 166 a48 48 0 0 1 48-48 h232 a48 48 0 0 1 48 48 v52 h-328z" fill="url(#hd)"/>
  <!-- rings -->
  <rect x="172" y="84" width="34" height="84" rx="17" fill="#4A3426"/>
  <rect x="306" y="84" width="34" height="84" rx="17" fill="#4A3426"/>
  <!-- check -->
  <path d="M166 328 l62 62 l112 -128" fill="none" stroke="#D9772F" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- heart -->
  <g transform="translate(392 392)">
    <circle r="62" fill="#FFFFFF"/>
    <path d="M0 34 C-46 4 -40 -30 -18 -34 C-8 -35 0 -28 0 -22 C0 -28 8 -35 18 -34 C40 -30 46 4 0 34z" fill="#F0587A"/>
  </g>
</g></svg>
