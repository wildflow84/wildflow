<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7B267"/><stop offset="1" stop-color="#D9702A"/>
    </linearGradient>
    <radialGradient id="face" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#E9A862"/><stop offset="1" stop-color="#C98342"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6B3208" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="262" r="196" fill="#FFF3E2" opacity=".35"/>
  <g id="dog" filter="url(#sh)">
    <!-- white chest -->
    <path d="M150 400 q-20-70 40-96 h132 q60 26 40 96 q-106 40 -212 0z" fill="#FFFFFF"/>
    <path d="M200 322 q20 26 56 26 q36 0 56-26" fill="none" stroke="#EADCC8" stroke-width="5" stroke-linecap="round"/>
    <!-- ears (dark, folded) -->
    <path d="M118 176 q-46 14 -38 86 q8 50 52 40 q18-40 14-98 q-2-20 -28-28z" fill="#4A2B18"/>
    <path d="M394 176 q46 14 38 86 q-8 50 -52 40 q-18-40 -14-98 q2-20 28-28z" fill="#4A2B18"/>
    <path d="M112 196 q-22 18 -14 56" fill="none" stroke="#6B4228" stroke-width="7" stroke-linecap="round"/>
    <path d="M400 196 q22 18 14 56" fill="none" stroke="#6B4228" stroke-width="7" stroke-linecap="round"/>
    <!-- head -->
    <path d="M256 92 c-92 0 -148 54 -148 132 c0 70 56 118 148 118 c92 0 148 -48 148 -118 c0 -78 -56 -132 -148 -132z" fill="url(#face)" stroke="#A8662D" stroke-width="4"/>
    <!-- white blaze -->
    <path d="M256 96 c-26 0 -42 10 -46 34 c-4 28 14 58 30 80 c6 8 12 12 16 12 c4 0 10 -4 16 -12 c16 -22 34 -52 30 -80 c-4 -24 -20 -34 -46 -34z" fill="#FFFFFF"/>
    <!-- dark eye patches -->
    <ellipse cx="190" cy="236" rx="46" ry="42" fill="#5B3319"/>
    <ellipse cx="322" cy="236" rx="46" ry="42" fill="#5B3319"/>
    <!-- muzzle -->
    <path d="M256 250 c-56 0 -86 30 -86 66 c0 30 28 46 86 46 c58 0 86 -16 86 -46 c0 -36 -30 -66 -86 -66z" fill="#F3E4CF"/>
    <path d="M176 322 q8 22 80 26 q72 -4 80 -26" fill="none" stroke="#D9C2A2" stroke-width="5" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="190" cy="232" r="25" fill="#1E1210"/>
    <circle cx="322" cy="232" r="25" fill="#1E1210"/>
    <circle cx="199" cy="222" r="9" fill="#FFFFFF"/>
    <circle cx="331" cy="222" r="9" fill="#FFFFFF"/>
    <circle cx="183" cy="243" r="4" fill="#FFFFFF" opacity=".7"/>
    <circle cx="315" cy="243" r="4" fill="#FFFFFF" opacity=".7"/>
    <!-- nose -->
    <path d="M256 264 c-22 0 -36 10 -36 22 c0 14 16 22 36 22 c20 0 36 -8 36 -22 c0 -12 -14 -22 -36 -22z" fill="#1E1210"/>
    <ellipse cx="244" cy="274" rx="9" ry="4.5" fill="#FFFFFF" opacity=".55"/>
    <!-- mouth with tiny underbite teeth -->
    <path d="M256 308 v14" stroke="#1E1210" stroke-width="6" stroke-linecap="round"/>
    <path d="M222 326 q34 24 68 0" fill="none" stroke="#1E1210" stroke-width="6" stroke-linecap="round"/>
    <path d="M240 334 l5 -8 l5 8z M262 334 l5 -8 l5 8z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    <!-- blush -->
    <ellipse cx="164" cy="298" rx="16" ry="9" fill="#F28B7B" opacity=".45"/>
    <ellipse cx="348" cy="298" rx="16" ry="9" fill="#F28B7B" opacity=".45"/>
  </g>
</svg>
