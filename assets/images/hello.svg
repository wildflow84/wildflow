<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="600" height="460">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#FFE7C9"/><stop offset="1" stop-color="#FBF5EA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="furW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3E7D6"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <ellipse cx="300" cy="230" rx="290" ry="215" fill="url(#glow)"/>
  <g fill="#F2C9A0" opacity=".55">
    <circle cx="70" cy="90" r="7"/><circle cx="540" cy="70" r="5"/><circle cx="520" cy="190" r="4"/><circle cx="48" cy="210" r="4"/>
  </g>
  <path d="M95 60 l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#F7B267"/>
  <path d="M505 120 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#F7B267"/>
  <!-- ground shadow -->
  <ellipse cx="300" cy="418" rx="230" ry="20" fill="#E9D5BC" opacity=".7"/>

  <!-- ===== child ===== -->
  <g id="child">
    <!-- legs -->
    <rect x="178" y="330" width="40" height="70" rx="18" fill="#3E5C9A"/>
    <rect x="228" y="330" width="40" height="70" rx="18" fill="#3E5C9A"/>
    <!-- shoes -->
    <path d="M168 398 q0-18 22-18 h26 q10 0 10 14 v10 h-58z" fill="#D9772F"/>
    <path d="M222 398 q0-18 22-18 h26 q10 0 10 14 v10 h-58z" fill="#D9772F"/>
    <rect x="168" y="404" width="58" height="8" rx="4" fill="#FFF6E8"/>
    <rect x="222" y="404" width="58" height="8" rx="4" fill="#FFF6E8"/>
    <!-- body (shirt) -->
    <path d="M168 270 q-6 66 10 84 h96 q16-18 10-84 q-6-30-58-30 q-52 0-58 30z" fill="#FFD36B"/>
    <!-- overalls -->
    <path d="M176 318 h92 q4 40 -2 70 h-88 q-6-30-2-70z" fill="#4D74C4"/>
    <rect x="186" y="270" width="16" height="56" rx="8" fill="#4D74C4"/>
    <rect x="242" y="270" width="16" height="56" rx="8" fill="#4D74C4"/>
    <circle cx="194" cy="322" r="5" fill="#FFD36B"/><circle cx="250" cy="322" r="5" fill="#FFD36B"/>
    <rect x="203" y="338" width="38" height="26" rx="8" fill="#3E5C9A"/>
    <!-- left arm (down) -->
    <path d="M168 280 q-28 24 -22 62" stroke="#FFD36B" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="146" cy="346" r="14" fill="#FFD9B8"/>
    <!-- right arm reaching to dog -->
    <path d="M276 282 q38 14 62 -6" stroke="#FFD36B" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="344" cy="272" r="14" fill="#FFD9B8"/>
    <!-- head -->
    <circle cx="223" cy="190" r="74" fill="#FFD9B8"/>
    <circle cx="150" cy="198" r="13" fill="#FFCBA4"/><circle cx="296" cy="198" r="13" fill="#FFCBA4"/>
    <!-- hair -->
    <path d="M150 178 q-6-70 73-72 q80 2 74 72 q-20-34 -74-34 q-54 0 -73 34z" fill="#5B3A29"/>
    <path d="M214 108 q-4-26 16-30 q-2 14 4 24z" fill="#5B3A29"/>
    <!-- face -->
    <ellipse cx="190" cy="204" rx="8" ry="10" fill="#3A2A22"/><ellipse cx="256" cy="204" rx="8" ry="10" fill="#3A2A22"/>
    <circle cx="193" cy="200" r="3" fill="#fff"/><circle cx="259" cy="200" r="3" fill="#fff"/>
    <ellipse cx="172" cy="226" rx="14" ry="9" fill="#FF9F8A" opacity=".65"/><ellipse cx="274" cy="226" rx="14" ry="9" fill="#FF9F8A" opacity=".65"/>
    <path d="M206 232 q17 22 34 0 q-17 8 -34 0z" fill="#B5473A"/>
    <path d="M206 232 q17 8 34 0 q-17 -2 -34 0z" fill="#fff"/>
  </g>

  <!-- ===== shih tzu ===== -->
  <g id="dog">
    <!-- tail -->
    <path d="M520 330 q46-30 22-82 q-8 30 -30 40z" fill="#F0D9BC"/>
    <path d="M526 322 q40-26 22-70 q-2 26 -20 38z" fill="#fff"/>
    <!-- body -->
    <ellipse cx="438" cy="352" rx="92" ry="62" fill="url(#furW)" stroke="#EAD8BF" stroke-width="3"/>
    <path d="M360 340 q20-40 70-34 q-30 10 -34 54z" fill="#E7C79F" opacity=".9"/>
    <path d="M470 300 q40 4 58 40 q-28 -20 -58 -22z" fill="#E7C79F" opacity=".8"/>
    <!-- hind paw + front paws -->
    <ellipse cx="500" cy="406" rx="30" ry="16" fill="#fff" stroke="#EAD8BF" stroke-width="3"/>
    <ellipse cx="392" cy="410" rx="30" ry="16" fill="#fff" stroke="#EAD8BF" stroke-width="3"/>
    <ellipse cx="440" cy="412" rx="28" ry="15" fill="#fff" stroke="#EAD8BF" stroke-width="3"/>
    <path d="M384 416 h2 M396 416 h2 M432 418 h2 M444 418 h2" stroke="#E2CBAE" stroke-width="2" stroke-linecap="round"/>
    <!-- chest fluff -->
    <path d="M388 336 q20 40 56 30 q-34 -4 -56 -30z" fill="#fff"/>
    <!-- head fur -->
    <path d="M356 214 q-18 74 40 98 q40 10 74-2 q60-26 38-96 q-14-50 -76-50 q-62 0 -76 50z" fill="#fff" stroke="#EAD8BF" stroke-width="3"/>
    <!-- tan face patch -->
    <path d="M410 168 q-30 10 -34 50 q22-10 48-8 q-4-30 -14-42z" fill="#E0B98A"/>
    <path d="M458 168 q30 10 34 50 q-22-10 -48-8 q4-30 14-42z" fill="#E0B98A" opacity=".0"/>
    <!-- ears -->
    <path d="M360 190 q-48 6 -46 74 q4 38 30 40 q16-30 20-70 q2-24 -4-44z" fill="#D7A877"/>
    <path d="M360 198 q-34 8 -32 60 q2 26 18 30 q8-24 12-56 q2-18 2-34z" fill="#E9C79B"/>
    <path d="M508 190 q48 6 46 74 q-4 38 -30 40 q-16-30 -20-70 q-2-24 4-44z" fill="#D7A877"/>
    <path d="M504 198 q34 8 32 60 q-2 26 -18 30 q-8-24 -12-56 q-2-18 -2-34z" fill="#E9C79B"/>
    <!-- topknot + ribbon --><g transform="translate(0 34)">
    <path d="M410 120 q22-44 44 0 q-22 -14 -44 0z" fill="#fff"/>
    <path d="M414 126 q18-34 36 -2 q-18 -8 -36 2z" fill="#E0B98A"/>
    <path d="M418 140 l-26 -14 q-4 16 4 28z M448 140 l26 -14 q4 16 -4 28z" fill="#E4572E"/>
    <circle cx="433" cy="142" r="9" fill="#C8401F"/></g>
    <!-- face -->
    <ellipse cx="404" cy="214" rx="11" ry="13" fill="#2B2220"/><ellipse cx="468" cy="214" rx="11" ry="13" fill="#2B2220"/>
    <circle cx="408" cy="209" r="4" fill="#fff"/><circle cx="472" cy="209" r="4" fill="#fff"/>
    <path d="M394 196 q10-10 22 -4 M458 192 q12-6 22 4" stroke="#C9A06E" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- muzzle -->
    <ellipse cx="436" cy="252" rx="34" ry="26" fill="#fff"/>
    <path d="M420 246 q16 -14 32 0 q-4 16 -16 18 q-12 -2 -16 -18z" fill="#2B2220"/>
    <ellipse cx="430" cy="244" rx="6" ry="3" fill="#fff" opacity=".6"/>
    <path d="M436 264 v8 M436 272 q-12 12 -22 -2 M436 272 q12 12 22 -2" stroke="#2B2220" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M424 276 q12 24 24 0 q-12 8 -24 0z" fill="#F08A9B"/>
    <ellipse cx="386" cy="244" rx="13" ry="8" fill="#FF9F8A" opacity=".5"/><ellipse cx="486" cy="244" rx="13" ry="8" fill="#FF9F8A" opacity=".5"/>
    <!-- hand on head -->
  </g>
  <!-- hand pat (drawn above dog head) -->
  <circle cx="352" cy="268" r="15" fill="#FFD9B8"/>
  <!-- little hearts -->
  <path d="M0 -10 q-10-14 -20 -4 q-8 10 8 24 l12 10 12-10 q16-14 8-24 q-10-10 -20 4z" fill="#F08A9B" transform="translate(318 92) scale(.7)"/>
  <path d="M0 -10 q-10-14 -20 -4 q-8 10 8 24 l12 10 12-10 q16-14 8-24 q-10-10 -20 4z" fill="#F7B267" transform="translate(356 62) scale(.45)"/>
</svg>
