<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="순대희 캘린더">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>순대희 캘린더</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // 카카오 지도 JS SDK를 처음 검색할 때 불러와 장소를 검색한다 (JSON 문자열 반환)
    window.ourdayKakaoSearch = function (key, query) {
      return new Promise(function (resolve, reject) {
        function run() {
          kakao.maps.load(function () {
            new kakao.maps.services.Places().keywordSearch(query, function (data, status) {
              if (status === kakao.maps.services.Status.OK) resolve(JSON.stringify(data));
              else if (status === kakao.maps.services.Status.ZERO_RESULT) resolve('[]');
              else reject(new Error('kakao ' + status));
            });
          });
        }
        if (window.kakao && window.kakao.maps) return run();
        var s = document.createElement('script');
        s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(key) + '&libraries=services&autoload=false';
        s.onload = run;
        s.onerror = function () { reject(new Error('kakao sdk load failed')); };
        document.head.appendChild(s);
      });
    };
  </script>
  <style>
    html, body { margin: 0; background: #FBF5EA; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #FBF5EA; font-family: -apple-system, 'Pretendard', 'Noto Sans KR', sans-serif; z-index: 10; transition: opacity .25s; }
    #splash img { width: min(280px, 72vw); height: auto; border-radius: 28px; box-shadow: 0 8px 24px rgba(138,90,34,.18); }
    #splash h1 { margin: 20px 0 4px; font-size: 22px; color: #3A2E26; }
    #splash p { margin: 0 0 26px; font-size: 13px; color: #9A8B7D; }
    #splash i { width: 22px; height: 22px; border: 2.5px solid #F0D3B6; border-top-color: #D9772F; border-radius: 50%; animation: sp 0.9s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash"><img src="splash.jpg" alt=""><h1>순대희 캘린더</h1><p>함께 쓰는 일정과 할 일</p><i></i></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('splash');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
