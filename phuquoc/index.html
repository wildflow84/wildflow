<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>🔒 비밀 여행 지도</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#2b3a4a;
    background:linear-gradient(#8fdcf5 0%,#d9f6ff 60%,#3bb6d6 60%,#5fc8e3 100%)}
  .card{background:#fff;border-radius:28px;padding:30px 26px 26px;width:min(92vw,380px);text-align:center;
    box-shadow:0 8px 0 rgba(31,143,179,.25)}
  .chest{font-size:64px;line-height:1;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px)}}
  h1{font-weight:400;font-size:26px;margin:10px 0 4px}
  p{margin:0 0 18px;color:#5b6b7b;font-size:16px}
  input[type=password]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:16px;border:3px solid #bfe9f5;outline:none;text-align:center}
  input[type=password]:focus{border-color:#3bb6d6}
  label.rem{display:flex;gap:8px;justify-content:center;align-items:center;margin:12px 0;font-size:15px;color:#5b6b7b}
  button{width:100%;font:inherit;font-size:20px;border:0;border-radius:16px;padding:12px;background:#ffc93c;color:#2b3a4a;
    box-shadow:0 5px 0 #d9a520;cursor:pointer}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #d9a520}
  .err{color:#ff5f5f;min-height:22px;margin-top:10px;font-size:16px}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="chest">🧰</div>
  <h1>비밀 여행 지도</h1>
  <p>암호를 넣으면 보물상자가 열려요 🗝️</p>
  <input type="password" id="pw" placeholder="암호 입력" autofocus>
  <label class="rem"><input type="checkbox" id="rem"> 이 기기에서 기억하기</label>
  <button type="submit">열기!</button>
  <div class="err" id="err"></div>
</form>

const KEY = 'phuquoc-gate-pw';
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(P.s), iterations:P.n, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.i)}, key, u8(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
async function tryOpen(pw, remember){
  const html = await unlock(pw);
  if (remember) { try { localStorage.setItem(KEY, pw); } catch(e) {} }
  show(html);
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value.trim();
  const err = document.getElementById('err'), card = document.getElementById('f');
  err.textContent = '여는 중… 🔓';
  try { await tryOpen(pw, document.getElementById('rem').checked); }
  catch(x) { err.textContent = '앗, 암호가 틀렸어요 🙈'; card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
});
(async () => { let saved = null; try { saved = localStorage.getItem(KEY); } catch(e) {}
  if (saved) { try { await tryOpen(saved, false); } catch(e) { try { localStorage.removeItem(KEY); } catch(_) {} } } })();
})();
